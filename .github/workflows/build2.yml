name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract & Auto-Inject Unity Ads Engine
        run: |
          unzip -q -o AndroidIDEProjects.zip
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"

          JAVA_FILE="app/src/main/java/com/devtanvir/dailydiamondbd/MainActivity.java"
          
          cat << 'EOF' > "$JAVA_FILE"
          package com.devtanvir.dailydiamondbd;

          import android.os.Bundle;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.Toast;
          import androidx.appcompat.app.AppCompatActivity;

          import com.unity3d.ads.IUnityAdsInitializationListener;
          import com.unity3d.ads.IUnityAdsLoadListener;
          import com.unity3d.ads.IUnityAdsShowListener;
          import com.unity3d.ads.UnityAds;
          import com.unity3d.ads.UnityAdsShowOptions;

          public class MainActivity extends AppCompatActivity {

              private WebView webview;
              private final String GAME_ID = "800397660";
              private final boolean TEST_MODE = true;
              private final String INTERSTITIAL_ID = "BP_Interstitial_Android";
              private final String REWARDED_ID = "BP_Rewarded_Android";

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  webview = new WebView(this);
                  setContentView(webview);

                  WebSettings settings = webview.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setDatabaseEnabled(true);
                  webview.setWebViewClient(new WebViewClient());

                  UnityAds.initialize(getApplicationContext(), GAME_ID, TEST_MODE, new IUnityAdsInitializationListener() {
                      @Override
                      public void onInitializationComplete() {
                          runOnUiThread(() -> {
                              Toast.makeText(MainActivity.this, "Unity Connected", Toast.LENGTH_SHORT).show();
                              loadAd(INTERSTITIAL_ID);
                              loadAd(REWARDED_ID);
                          });
                      }

                      @Override
                      public void onInitializationFailed(UnityAds.UnityAdsInitializationError error, String message) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Init Error: " + message, Toast.LENGTH_LONG).show());
                      }
                  });

                  webview.addJavascriptInterface(new Object() {

                      @JavascriptInterface
                      public void showUnityInterstitial() {
                          runOnUiThread(() -> {
                              UnityAds.show(MainActivity.this, INTERSTITIAL_ID, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override
                                  public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                      loadAd(INTERSTITIAL_ID);
                                  }
                                  @Override
                                  public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                      Toast.makeText(MainActivity.this, "Interstitial Error: " + message, Toast.LENGTH_SHORT).show();
                                      loadAd(INTERSTITIAL_ID);
                                  }
                                  @Override
                                  public void onUnityAdsShowStart(String placementId) {}
                                  @Override
                                  public void onUnityAdsShowClick(String placementId) {}
                              });
                          });
                      }

                      @JavascriptInterface
                      public void showUnityRewarded() {
                          runOnUiThread(() -> {
                              UnityAds.show(MainActivity.this, REWARDED_ID, new UnityAdsShowOptions(), new IUnityAdsShowListener() {
                                  @Override
                                  public void onUnityAdsShowComplete(String placementId, UnityAds.UnityAdsShowCompletionState state) {
                                      if (state == UnityAds.UnityAdsShowCompletionState.COMPLETED) {
                                          webview.post(() -> webview.evaluateJavascript("if(window.onAdRewardedSuccess){window.onAdRewardedSuccess();}", null));
                                      }
                                      loadAd(REWARDED_ID);
                                  }
                                  @Override
                                  public void onUnityAdsShowFailure(String placementId, UnityAds.UnityAdsShowError error, String message) {
                                      Toast.makeText(MainActivity.this, "Video Error: " + message, Toast.LENGTH_SHORT).show();
                                      loadAd(REWARDED_ID);
                                  }
                                  @Override
                                  public void onUnityAdsShowStart(String placementId) {}
                                  @Override
                                  public void onUnityAdsShowClick(String placementId) {}
                              });
                          });
                      }
                  }, "AndroidBridge");

                  webview.loadUrl("https://dailydiamondbd.netlify.app");
              }

              private void loadAd(final String placementId) {
                  UnityAds.load(placementId, new IUnityAdsLoadListener() {
                      @Override
                      public void onUnityAdsAdLoaded(String pId) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Ad Ready: " + pId, Toast.LENGTH_SHORT).show());
                      }

                      @Override
                      public void onUnityAdsFailedToLoad(String pId, UnityAds.UnityAdsLoadError error, String message) {
                          runOnUiThread(() -> Toast.makeText(MainActivity.this, "Ad Failed: " + message, Toast.LENGTH_LONG).show());
                      }
                  });
              }
          }
          EOF

          chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyDiamondBD-UnityAds-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          
