name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Extract, Fix Syntax & Setup
        run: |
          unzip -q -o AndroidIDEProjects.zip
          GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
          PROJECT_DIR=$(dirname "$GRADLE_PATH")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          cd "$PROJECT_DIR"
          
          # MainActivity.java-এর শেষ লাইনের 'কে' টাইপো অটো-ফিক্স
          JAVA_FILE="app/src/main/java/com/devtanvir/dailydiamondbd/MainActivity.java"
          if [ -f "$JAVA_FILE" ]; then
            sed -i 's/} কে/}/g' "$JAVA_FILE"
          fi

          chmod +x gradlew

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DailyDiamondBD-UnityAds-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
